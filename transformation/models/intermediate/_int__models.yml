version: 2

models:
  - name: int_opportunity_enriched
    description: >
      Opportunities joined with accounts, users, campaigns and stage seed.
      One row per opportunity. Business logic layer — no raw source joins in marts.
    columns:
      - name: opportunity_id
        description: Primary key — Salesforce opportunity ID.
        tests:
          - unique
          - not_null
      - name: opportunity_outcome
        description: Derived field — Won, Lost or Open.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Won', 'Lost', 'Open']
      - name: accountid
        description: FK to stg_salesforce__account.
        tests:
          - not_null
      - name: pipeline_phase
        description: High level pipeline phase from seed.
        tests:
          - accepted_values:
              arguments:
                values: ['Early', 'Mid', 'Late', 'Closed']
                severity: warn

  - name: int_case_enriched
    description: >
      Cases joined with accounts, contacts, users and case history aggregation.
      One row per case.
    columns:
      - name: case_id
        description: Primary key — Salesforce case ID.
        tests:
          - unique
          - not_null
      - name: case_status
        description: Current case status.
        tests:
          - not_null

  - name: int_opportunity_stage_history
    description: >
      Opportunity stage history joined with opportunity and account context.
      One row per stage transition event. Derives is_first_stage, is_final_stage,
      is_won_stage and days_in_prev_stage using a window function.
      Used as the single input to fct_opportunity_stage_history.
    columns:
      - name: opportunity_history_id
        description: Primary key — Salesforce opportunity history ID.
        tests:
          - unique
          - not_null
      - name: opportunityid
        description: FK to stg_salesforce__opportunity.
        tests:
          - not_null
      - name: to_stage
        description: Stage name after this transition.
        tests:
          - not_null
      - name: is_first_stage
        description: True if this is the opening stage (no prior stage recorded).
        tests:
          - not_null
      - name: is_final_stage
        description: True if to_stage is Closed Won or Closed Lost.
        tests:
          - not_null

  - name: int_lead_enriched
    description: >
      Leads joined with users and lead status seed.
      One row per lead.
    columns:
      - name: lead_id
        description: Primary key — Salesforce lead ID.
        tests:
          - unique
          - not_null
      - name: lead_lifecycle_stage
        description: Derived field — Converted, Deleted or Active.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Converted', 'Deleted', 'Active']